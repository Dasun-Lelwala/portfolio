<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A gallery of graphic design work by Dasun Lelwala.">
    <title>Graphic Design | Dasun Lelwala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style3.css">
    <link rel="stylesheet" href="graphic-designs.css">
</head>
<body>
    <div id="scroll-progress" aria-hidden="true"></div>

    <header class="subpage-header">
        <div class="subpage-header-inner">
            <a href="index.html" class="brand-link" aria-label="Dasun Lelwala Portfolio Home">
                <svg class="brand-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                    <text x="2" y="27" font-family="Inter, Arial, sans-serif" font-size="25" font-style="italic" font-weight="800" letter-spacing="-3" fill="currentColor">D<tspan fill="#0ea5e9">L</tspan></text>
                </svg>
                <span class="brand-name">Dasun Lelwala</span>
            </a>
            <a href="index.html#graphic-design" class="back-link">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                Back to Portfolio
            </a>
        </div>
    </header>

    <main class="subpage-main">
        <section class="projects-hero reveal" aria-labelledby="designs-title">
            <span class="projects-eyebrow">05 / Visual Stories</span>
            <h1 id="designs-title">Graphic <span>Design</span></h1>
            <p>A selection of graphic design work across promotional artwork, social media, and visual identity. Select any design to view it larger.</p>
        </section>

        <section id="design-gallery" class="design-gallery" aria-label="Graphic design portfolio"></section>
    </main>

    <footer class="subpage-footer">
        <div>
            <p class="footer-author">Dasun Lelwala</p>
            <p>© <span id="year"></span> • Engineering Undergraduate Portfolio</p>
        </div>
    </footer>

    <dialog id="design-lightbox" class="design-lightbox" aria-labelledby="lightbox-title">
        <div class="design-lightbox-header">
            <h2 id="lightbox-title">Design preview</h2>
            <button type="button" class="design-lightbox-close" aria-label="Close design preview">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
        <img class="design-lightbox-image" src="" alt="">
    </dialog>

    <script src="script2.js"></script>
    <script src="script.js"></script>
    <script src="graphic-designs.js"></script>
</body>
</html>
